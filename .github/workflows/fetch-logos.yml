name: fetch-logos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/logos.txt, tools/fetch_logos.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_logos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/logos
          git diff --cached --quiet || git commit -m "로고 후보 내려받기"
          git push
