<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;700&display=swap">
<style>
:root{--ink:#14202b;--steel:#4a5966;--paper:#f6f7f5;--line:#d9ddd8;--pipe:#f5c400;color-scheme:light}

.brand{font:1.2rem "Black Han Sans",sans-serif}

.posts{list-style:none;padding:0;margin:24px 0 60px}
.posts li{border-bottom:1px solid var(--line);padding-block:18px}
.posts a{font-weight:700;font-size:1.1rem;color:var(--ink)}
.posts time{display:block;color:var(--steel);font-size:.85rem}
.empty{color:var(--steel)}
</style>
